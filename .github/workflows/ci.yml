name: CI and Pages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - name: sendReport only in src/transport
        run: "! grep -rn sendReport src --include=*.js | grep -v '^src/transport/'"
      - name: no innerHTML or eval anywhere in src
        run: "! grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|eval[(]' src --include=*.js"
      - name: analysis/ (official MCHOSE code) is not in the repo
        run: test ! -e analysis
      - name: build the site from an explicit file list
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/src
          test ! -e _site/analysis
          test "$(find _site -name '*.js' | wc -l)" -gt 0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
